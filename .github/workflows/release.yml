name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

# Calls the shared RemoteMedia-SDK reusable workflow that compiles
# the plugin on ubuntu / macos / windows, packages the cdylib under
# the canonical `lib{name}-{arch}-{os}.{ext}` asset name (matching
# the `asset_pattern` in `plugin.toml`), and uploads everything to
# a GitHub Release for the pushed tag.
#
# Why `skip-platforms: aarch64-linux`:
# foundry-local-sdk@1.1 has no `linux-aarch64` native libs AND its FFI
# shim hardcodes `c_char = i8` (x86 default), so the source doesn't
# even compile on ARM64 Linux where `c_char = u8`. Until upstream
# adds aarch64-linux support we publish for the other 3 platforms
# (x86_64-linux, aarch64-darwin, x86_64-windows). Consumers on
# ARM64 Linux hit a precise `PlatformNotPublished` from the resolver.
#
# The reusable workflow lives in the public remotemedia-plugin-sdk
# repo: GitHub does not let a public repo call a workflow in a private
# one (remotemedia-sdk). Its `@main` carries the `skip-platforms` input.
#
# NOTE on Foundry's native libraries:
# `foundry-local-sdk`'s build.rs downloads ~hundreds of MB of
# Foundry Core engine + ORT GenAI native libs from NuGet/ORT-Nightly
# and places them in cargo's `OUT_DIR`. At runtime the SDK
# `libloading`s them. If a release uploaded from CI turns out NOT to
# carry the bundled natives in a consumer-discoverable way, the fix
# is to switch to the multi-binary upload pattern (see llama-cpp's
# `scripts/release-local.sh` for a working precedent).
jobs:
  release:
    uses: RemoteMedia-SDK/remotemedia-plugin-sdk/.github/workflows/build-plugin.yml@main
    with:
      crate-name:     foundry-local-plugin
      display-name:   foundry-local
      tag:            ${{ inputs.tag || github.ref_name }}
      skip-platforms: aarch64-linux
    permissions:
      contents: write
