[package]
name = "foundry-local-plugin"
version = "0.5.0"
edition = "2021"
publish = false

[lib]
name = "foundry_local_plugin"
crate-type = ["cdylib"]

# Standalone workspace — fully decoupled from any parent so the
# `foundry-local-sdk` build.rs (which downloads ~hundreds of MB of
# Foundry Core + ORT GenAI native libs from NuGet/ORT-Nightly) and
# the SDK's heavy transitive deps never unify against a consumer's
# workspace.
[workspace]

[profile.release]
opt-level = 3
lto = "thin"
debug = 0

[profile.dev]
opt-level = 1
debug = 1
incremental = true

# ---------------------------------------------------------------------------
# Dependencies — Path 3 loadable cdylib (hand-rolled AsyncStreamingNode).
#
# Notable absences:
#   * `remotemedia-core` — would force ort / llama / multiprocess into
#     our tree. Plugin runtime surface is the skinny crates only.
#   * `reqwest`, `hyper` — Foundry Local runs in-process via FFI to
#     the downloaded Foundry Core engine; no HTTP layer.
# ---------------------------------------------------------------------------
[dependencies]
# Umbrella crate that re-exports the skinny ABI surface
# (remotemedia-types, remotemedia-traits, StreamingNodeFfiAdapter,
# plugin_export!) plus the abi_stable + async_ffi + rmp-serde
# building blocks.
#
# Pinned by `rev` to the remotemedia-plugin-sdk commit that ships
# plugin-sdk 0.7.0 / loadable-node-abi 0.5.0 (the ABI the host requires).
remotemedia-plugin-sdk = { git = "https://github.com/RemoteMedia-SDK/remotemedia-plugin-sdk", rev = "d6f90d98b433ca64b2e2b42ab27e6e079986d0b9" }

# Skinny shared LLM primitives — per-session `HistoryEntry`,
# `ToolSpec`, streaming `ToolCallAccum` + `dispatch_tool_call`. The
# in-tree `OpenAIChatNode` uses the exact same source. Formerly the
# `remotemedia-llm` crate; renamed to `remotemedia-modality` (LLM
# primitives behind the `llm` feature) and moved to the
# remotemedia-plugin-sdk repo. Pinned to the same rev as the SDK so
# both share one `remotemedia-types`.
remotemedia-modality = { git = "https://github.com/RemoteMedia-SDK/remotemedia-plugin-sdk", rev = "d6f90d98b433ca64b2e2b42ab27e6e079986d0b9", features = ["llm"] }

# Direct deps required by attribute macros expanded inside
# `plugin_export!()` (`#[sabi_extern_fn]`, `#[export_root_module]`).
abi_stable = "0.11"

# Trait machinery + async runtime helpers.
async-trait = "0.1"
tokio = { version = "1.35", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }
tokio-stream = "0.1"

# Config (de)serialization + schema generation for the manifest.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

# Diagnostics + concurrency primitives.
tracing = "0.1"
parking_lot = "0.12"

# Microsoft Foundry Local SDK. `1.1` is the latest as of writing;
# `build.rs` downloads Foundry Core engine + ORT GenAI native libs
# from NuGet/ORT-Nightly at compile time (one-shot, cached). Enable
# `winml` for NPU/GPU acceleration on Windows (no-op elsewhere).
foundry-local-sdk = { version = "1.1" }
# foundry-local-sdk = { version = "1.1", features = ["winml"] }
